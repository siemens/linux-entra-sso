name: release Mozilla extensions

on:
  push:
    tags:
      - 'v*.*'
      - 'v*.*.*'

permissions: {}

env:
  WEB_EXT_VERS: 10.6.0

jobs:
  release-mozilla:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: get git committer
        run: |
          echo "GIT_COMMITTER=$(git show -s --format='%cn <%ce>')" >> $GITHUB_ENV

      - name: install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make git zip

      - name: build packages
        run: RELEASE_TAG=${{ github.ref_name }} make package deb

      - name: sign Firefox extension by Mozilla
        run: |
          npx web-ext@${{ env.WEB_EXT_VERS }} sign \
            --channel listed \
            --api-key ${{ secrets.AMO_API_KEY }} \
            --api-secret ${{ secrets.AMO_API_SECRET }} \
            --source-dir build/firefox \
            --artifacts-dir build \
            --amo-metadata platform/firefox/amo-metadata.json \
            --approval-timeout 0

      # self distributed extensions on Thunderbird are not signed
      - name: build Thunderbird extension
        run: |
          npx web-ext@${{ env.WEB_EXT_VERS }} build \
            --source-dir build/thunderbird \
            --artifacts-dir build \
            --filename '{name}-{version}.thunderbird.xpi'

      - name: upload Thunderbird extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thunderbird-xpi
          path: |
            build/linux_entra_sso-*.xpi

      - name: upload debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-package
          path: |
            pkgs/linux-entra-sso_*.deb

      - name: attest Mozilla extension build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/linux_entra_sso-*.xpi
            pkgs/linux-entra-sso_*.deb

      - name: create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/linux_entra_sso-*.xpi
            pkgs/linux-entra-sso_*.deb
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Release of version ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: true

      - name: checkout main branch for update manifests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: create update manifest for Thunderbird
        run: |
          VERSION=$(echo ${{ github.ref_name }} | cut -c 2-)
          DIGEST="sha256:$(sha256sum build/linux_entra_sso-${VERSION}.thunderbird.xpi | cut -d ' ' -f 1)"
          LINK="https://github.com/siemens/linux-entra-sso/releases/download/v${VERSION}/linux_entra_sso-${VERSION}.thunderbird.xpi"
          jq --arg version "${VERSION}" --arg digest "${DIGEST}" --arg link "${LINK}" \
            '."addons"."@linux-entra-sso.tb"."updates" += [{"version":$version, "update_link":$link, "update_hash":$digest}]' \
            .pages/thunderbird/updates.json \
            > .pages/thunderbird/updates.json.tmp && mv .pages/thunderbird/updates.json.tmp .pages/thunderbird/updates.json

      - name: prepare PR for Thunderbird update manifests
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            .pages/thunderbird/updates.json
          commit-message: "chore: release Thunderbird update manifests"
          branch: ci/release-firefox-update-manifest
          base: main
          title: "chore: release Thunderbird update manifests [bot]"
          assignees: fmoessbauer
          reviewers: jan-kiszka
          author: ${{ env.GIT_COMMITTER }}
          committer: ${{ env.GIT_COMMITTER }}
          signoff: true
          body: |
            Publish update manifest for Thunderbird extensions, version ${{ github.ref_name }}.
